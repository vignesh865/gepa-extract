[project]
name = "gepa-extract"
version = "0.1.0"
description = "GEPA-inspired optimization of document-extraction field descriptions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gepa>=0.1.4",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
render = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gepa_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
